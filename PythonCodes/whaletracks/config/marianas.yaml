# Configuration for the Marianas Bryde's-whale detection + multipath ranging run.
# Values reproduce the parameters previously hardcoded in
# MP_Marianas_automation_Brydes.py.

client: IRIS            # FDSN data center
network: XF             # seismic network code
location: "*"           # location code ('*' = any)

# Per-station geometry / channel / date ranges live in this CSV table.
# Path is resolved relative to this config file.
station_table: Station_info_Marianas_Brydes.csv
site_range: [0, 7]      # rows of the station table to process (start, stop)

output_dir: .           # where detection/autocorr CSVs are written

# Sound speeds (m/s) used by the analytic ranging model
sound_speed:
  water: 1512
  sediment: 1512

# Bryde's-call detection kernel (descending FM sweep)
kernel:
  f0: 37                # start frequency (Hz)
  f1: 33                # end frequency (Hz)
  bdwdth: 2             # bandwidth (Hz)
  dur: 3                # duration (s)

# Data download / chunking
download:
  day_length_s: 43200   # 60*60*12 : waveform chunk downloaded per iteration
  chunk_length_s: 1200  # 60*20    : window used to estimate a range via autocorrelation
  dt_up_s: 2            # multipath search window before the direct arrival
  max_retries: 5        # IRIS fetch retries per chunk

# Instrument response removal
response:
  output: VEL
  pre_filt: [1, 3, 45, 49]

# Spectrogram parameters
spectrogram:
  window_size: 0.8
  overlap: 0.95
  freqlim: [10, 45]

# Signal-to-noise measurement
snr:
  limits: [28, 40]      # call band for SNR/amplitude
  calllength: 1
  freqwidth: 3
  eq_band: [5, 15]      # low band to screen earthquakes / T-phases

# Event (call) picking
event:
  prominence: 1000      # minimum detection-score threshold
  dur: 0.1              # minimum detection width (s)
  distance: 16          # minimum spacing between detections (s)
  rel_height: 0.5

# Multipath autocorrelation picking
multipath:
  dur: 0.1
  prominence: 0
  distance: 1
  rel_height: 0.5

# If true, append to existing per-station CSVs instead of overwriting
is_restart: false
