# Range estimation + plotting config — FIN whales, Marianas.
# Used by: whaletracks-plot-ranges --config ranges_fin.yaml --station B20
#
# Paths resolved relative to the current working directory (run from PythonCodes).

ranging_source: bellhop

# Shared BELLHOP ray-arrival tables (same tables used for both species)
bellhop_dir: data/bellhop_arrival_models
bellhop_template: "Marianas_ray_{station}_bellhop_arrivals.csv"

analytic:
  depth: 5271
  ss: 1512
  sed_speed: 1550
  t: 419

reflectivity: false

# Fin detection / autocorrelation inputs.
# calls  = per-call detections (peak_time); auto = per-window autocorrelation
# timings (arrival_1..5). B20 (CORTADO_TEST dataset) is the worked station.
calls_dir: data/fin_whale
calls_template: "{station}_mp_CORTADO_TEST.csv"
auto_template: "auto_{station}_mp_CORTADO_TEST.csv"

output_dir: data/fin_whale
output_template: "Marianas_auto_{station}_CORTADO_TEST_v2.csv"

# Airgun survey from February 2013 onward corrupts the multipath timings
# (Hilmo et al. 2025); windows from then on are excluded.
valid_end: "2013-02-01"

# Published fin ranging gate (Hilmo et al. 2025): a window is ranged only when
# its centre minute has >= 2 detected calls AND the surrounding 20-min window
# has >= 10 (author decision 2026-09-29 to apply it here in the offline ranging
# step as well as at detection). ranges_brydes.yaml omits this block, keeping
# the legacy Bryde's gate (centre >= 1 only).
ranging:
  min_center: 2
  min_window: 10
  window_length_s: 1200

# Fin auto output has no earthquake-band column, so only the auto_max filter
# applies (max_low_freq_snr is omitted).
filters:
  min_auto_max: 3

ylim_km: [0, 40]
