# Configuration for interactive manual picking of Bryde's whale calls.
# Values reproduce the parameters previously hardcoded in
# Brydes_manual_picker.py.

client: IRIS            # FDSN data center
network: XF             # seismic network code
location: "*"           # location code ('*' = any)
channel: "HHZ,EHZ,ELZ,BHZ,EDH"   # channels to try (first available is used)

# Pick one station at a time (recommended)
station_list:
  - B19

# Time window for picking; each chunk spans chunk_length_s seconds.
starttime: "2012-7-31T21:30:00.000"
endtime: "2012-7-31T23:30:00.000"
chunk_length_s: 1800    # spectrogram time chunk (seconds)
max_retries: 5          # IRIS fetch retries

# Working (per-chunk) CSV and final CSV. Paths resolve relative to this config.
chunk_file: brydes_picks.csv
detection_file: final_brydes_picks.csv

# If true, append to an existing chunk_file instead of starting fresh
is_restart: true

# Instrument response removal
response:
  pre_filt: [8, 10, 45, 47]

# Spectrogram parameters
spectrogram:
  window_size: 4
  overlap: 0.98
  freqlim: [10, 47]     # frequency band subsampled for display / dB conversion

# Signal-to-noise measurement of manual picks
snr:
  limits: [35, 40]
  calllength: 1
  freqwidth: 3
  dur: 2

# Plot appearance
plot:
  figsize: [14, 6]
  ylim: [25, 47]        # spectrogram frequency axis limits (Hz)
