# Detection + multipath ranging config — FIN whales, Marianas.
# Reproduces the published method of Hilmo & Wilcock (2024, JASA) and
# Hilmo et al. (2025, Endangered Species Research), as implemented in the
# canonical MP_Marianas_automation.py (fin branch).
# Used by: whaletracks-detect --config detect_fin.yaml

client: IRIS            # FDSN data center (anonymous access; public data)
network: XF
location: "*"

# Shared station table (the 7 published good-data OBS), used by BOTH species.
# Path is relative to the working directory (run from PythonCodes).
station_table: data/Station_info_Marianas.csv
site_range: [0, 7]      # rows of the station table to process (start, stop)

output_dir: data/fin_whale

output:
  detection_template: "{station}_mp.csv"
  auto_template: "auto_{station}_mp.csv"

sound_speed:
  water: 1512
  sediment: 1512

# Fin-call detection kernel (descending FM sweep, 20->15 Hz over 0.8 s, per
# Hilmo & Wilcock 2024 Table I and Hilmo et al. 2025; corrects the automation
# code copy's f0=22 — see KNOWN_ISSUES.md, species-agnostic decisions #6).
kernel:
  f0: 20
  f1: 15
  bdwdth: 3
  dur: 0.8

download:
  day_length_s: 43200   # 12 h waveform chunk
  chunk_length_s: 1200  # 20-min autocorrelation window (Hilmo & Wilcock 2024)
  dt_up_s: 0.6          # multipath search window before the direct arrival
  max_retries: 5

response:
  output: VEL
  detrend: demean
  pre_filt: [1, 3, 45, 49]

spectrogram:
  window_size: 0.8
  overlap: 0.95
  freqlim: [10, 40]

# SNR call band as computed by the automation code: [(f0+f1)/2 - 3, (f0+f1)/2 + 3]
# with its f0=22 kernel = [15.5, 21.5]. Retained as-is after the kernel correction
# (a 20-based formula would give [14.5, 20.5]) — see KNOWN_ISSUES.md #6.
# No eq_band -> no earthquake-band SNR column (the published fin method does not
# use an automated earthquake/T-phase discriminator).
snr:
  limits: [15.5, 21.5]
  calllength: 1
  freqwidth: 3

amps:
  dt_up: 3
  dt_down: 2
  pad_length: 2000

event:
  prominence: 500
  dur: 0.1
  distance: 16
  rel_height: 0.5

multipath:
  dur: 0.1
  prominence: 0
  distance: 1
  rel_height: 0.5

# Published fin criteria (Hilmo et al. 2025): a range is attempted only when the
# center minute has >= 2 calls AND the surrounding 20-min window has >= 10 calls.
ranging:
  min_center: 2
  min_window: 10

is_restart: false
