name: mp_ranging_casestudy
channels:
  - conda-forge
dependencies:
  # Core scientific stack (versions resolved by conda-forge; numpy no longer
  # pinned to the legacy 1.16 that blocked modern obspy/scipy).
  - python=3.12
  - numpy
  - scipy
  - pandas
  - matplotlib
  - obspy
  # Configuration + notebooks
  - pyyaml
  - notebook
  # Dev tooling
  - pytest
  - ruff
  # Editable install of the local `whaletracks` package (pyproject.toml)
  - pip
  - pip:
      - -e .
